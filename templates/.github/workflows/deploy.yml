# Every merge to @@defaultBranch@@ deploys. CI runs first as a called workflow, so a red check can
# never reach production.
name: Deploy

on:
  push:
    branches: [@@defaultBranch@@]
  workflow_dispatch:

# Never let two deploys race; queue rather than cancel, so a merged commit is never skipped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: @@scaffoldRepo@@/.github/workflows/fly-deploy.yml@@@scaffoldRef@@
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
